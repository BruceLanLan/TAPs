[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned so that the holder's creation code, and therefore its CREATE2 address, is the same for everyone.
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "../vectors" }]

[fuzz]
runs = 512
